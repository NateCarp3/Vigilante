{% extends "base.html" %}
{% block title %}{{ title }} — Vigilante{% endblock %}
{% block content %}
<section class="wrap section">
  <div class="section-head">
    <h1 class="display">{{ title|upper }}</h1>
    <span class="section-link">{{ products|length }} ITEMS</span>
  </div>
  <div class="grid">
    {% for p in products %}{% include "_card.html" %}{% endfor %}
  </div>
</section>
{% endblock %}
